<style>
:root{
  --ink:#17181a; --char:#222426; --sand:#f6efe2; --sand2:#ecdfc6; --cream:#fffaf0;
  --red:#c8202a; --red-d:#a3161f; --green:#2d7a38; --green-d:#1d5a28; --leaf:#4aae52;
  --gold:#ffd27a; --muted:#5b5d60; --line:#e3d7bd;
  --chrome:rgba(23,24,26,.96); --stage:#2a2318;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;min-height:100dvh}
.skip{position:absolute;left:10px;top:-60px;background:#fff;padding:8px 12px;z-index:80;font-weight:700;border-radius:8px;color:var(--ink);text-decoration:none}
.skip:focus{top:10px}
:focus-visible{outline:3px solid #ffbf3c;outline-offset:2px}

/* chrome */
.chrome{flex:none;background:var(--chrome);color:#fff;border-bottom:3px solid var(--red);z-index:40;padding:0 12px calc(6px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.chrome-row{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:-.01em;white-space:nowrap;min-width:0}
.brand img{width:40px;height:40px;flex:none}
.brand small{display:block;font-weight:600;font-size:.68rem;opacity:.75;letter-spacing:.04em;text-transform:uppercase}
.brand .n{font-size:.95rem;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:#2f3235;border-radius:999px;padding:3px;margin-left:auto;flex:none}
.lang button{font:inherit;font-weight:800;font-size:.8rem;border:0;background:transparent;color:#d8d5cd;padding:7px 11px;min-height:34px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.viewtoggle{display:flex;background:#2f3235;border-radius:12px;padding:3px;flex:none}
.viewtoggle button{font:inherit;font-weight:700;font-size:.8rem;border:0;background:transparent;color:#d8d5cd;padding:7px 11px;min-height:34px;border-radius:10px;cursor:pointer}
.viewtoggle button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;padding:0 0 8px}
.search input{flex:1;font:inherit;border:0;border-radius:12px;padding:10px 12px;min-height:42px;background:#fff;color:var(--ink)}
.search button{font:inherit;font-weight:700;font-size:.8rem;border:0;background:#2f3235;color:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;min-height:42px}
.ticker{display:flex;gap:14px;flex-wrap:wrap;font-weight:800;font-size:.82rem;color:#ffd27a;padding:0 2px 8px}
.ticker b{color:#fff;font-size:1.05rem}
.ticker .sep{opacity:.4;font-weight:600;color:#fff}

/* stage */
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:
  radial-gradient(1200px 500px at 50% -10%, #4a3a24 0%, transparent 60%), var(--stage);cursor:grab;user-select:none}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:2880px;transform-origin:0 0;color:var(--ink)}
#world.moving{will-change:transform}

/* world art */
.world-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:0}
.world-inner{position:relative;padding:48px 56px 72px;display:flex;flex-direction:column;gap:28px}
.hero-band{text-align:center;color:var(--ink)}
.hero-band .logo-row{display:flex;justify-content:center;margin-bottom:12px}
.hero-band .logo-row img{width:96px;height:96px}
.hero-band h1{margin:0;font-size:42px;letter-spacing:-.03em;line-height:1.1}
.hero-band h1 em{font-style:normal;color:var(--red-d)}
.hero-band .stat{display:inline-block;margin-top:10px;background:var(--ink);color:var(--gold);font-weight:850;font-size:32px;padding:8px 20px;border-radius:999px;letter-spacing:-.02em}
.hero-band .sub{max-width:1400px;margin:16px auto 0;font-size:20px;color:#3a3a3a;line-height:1.45}
.hero-band .ticks{margin-top:16px;display:flex;justify-content:center;gap:28px;font-weight:800;font-size:18px}
.hero-band .ticks b{color:var(--red-d);font-size:24px}

/* people / cards */
.richi-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:3}
.person-card{background:#fff;border:3px solid var(--ink);border-radius:28px;padding:16px 18px 14px;text-align:center;box-shadow:8px 10px 0 rgba(23,24,26,.18);width:300px}
.person-card.richi{width:340px;border-color:var(--red);background:linear-gradient(#fffaf0,#fff)}
.person-card .fig{width:160px;height:260px;margin:0 auto}
.person-card.richi .fig{width:180px;height:290px}
.person-card h3{margin:8px 0 0;font-size:22px}
.person-card .role{font-weight:800;color:var(--red-d);font-size:15px}
.person-card .duty{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.35}
.badge-ok{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;font-weight:850;letter-spacing:.04em;text-transform:uppercase;padding:10px 18px;border-radius:999px;font-size:16px;border:3px solid var(--ink);box-shadow:0 6px 0 #123}
.badge-ok .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(255,210,122,.4)}
.badge-long{max-width:640px;text-align:center;font-weight:700;font-size:16px;color:#222}

.connectors{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}

.field-sec,.office-sec{position:relative;z-index:2}
.sec-head{text-align:center;margin-bottom:16px}
.sec-head h2{margin:0;font-size:34px;letter-spacing:-.02em}
.sec-head p{margin:6px auto 0;max-width:1100px;font-size:18px;color:#3a3a3a}
.crew-row{display:flex;justify-content:center;gap:16px;flex-wrap:nowrap}
.person-card.crew{width:250px;padding:10px 10px 12px}
.person-card.crew .fig{width:120px;height:200px}
.person-card.crew h3{font-size:16px}

.hq{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.div-panel{background:#fffaf0;border:3px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:8px 10px 0 rgba(23,24,26,.14);cursor:pointer}
.div-panel .div-head{padding:16px 20px 14px;color:#fff;border-bottom:3px solid var(--ink)}
.div-panel .div-head h2{margin:0;font-size:26px;letter-spacing:-.02em}
.div-panel .div-head p{margin:6px 0 0;font-size:14px;line-height:1.35;opacity:.92}
.div-body{padding:14px 14px 18px;display:flex;flex-direction:column;gap:14px;background:repeating-linear-gradient(180deg,#fffaf0,#fffaf0 28px,#f3ead8 28px,#f3ead8 29px)}
.dept{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px;cursor:pointer}
.dept h3{margin:0 0 10px;font-size:16px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dept h3 .n{background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.bots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bot-card{display:flex;align-items:flex-start;gap:8px;background:#fff;border:2px solid #d9cdb2;border-radius:14px;padding:8px;cursor:pointer;text-align:left;min-height:76px}
.bot-card:hover,.bot-card:focus{border-color:var(--ink);background:#fff6d8}
.bot-card .ico{flex:none;width:46px;height:46px}
.bot-card .t{font-weight:800;font-size:14px;line-height:1.2}
.bot-card .d{font-size:12px;color:#555;line-height:1.3;margin-top:2px}
.bot-card.match,.dept.match,.div-panel.match{outline:3px solid #e0a100;outline-offset:1px}
.bot-card.dim,.dept.dim,.div-panel.dim,.person-card.dim{opacity:.22}

.legal-note,.foot{text-align:center;font-size:15px;color:#333}
.foot{font-weight:700;padding-top:8px}

/* zoom chrome */
.zoombar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:5px;z-index:20;pointer-events:none;align-items:stretch}
.zoombar > *{pointer-events:auto}
.zoombar button,.zoombar .zl{font:inherit;font-weight:800;border:2px solid var(--ink);background:#fff;border-radius:12px;min-width:44px;min-height:40px;cursor:pointer;box-shadow:3px 4px 0 rgba(0,0,0,.2);line-height:1}
.zoombar .zl{display:grid;place-items:center;font-size:12px;cursor:default}
.zoombar .wide{padding:0 8px;font-size:11px;letter-spacing:.02em}
.zoombar .pm{font-size:22px;font-weight:900}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(23,24,26,.88);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;z-index:20;pointer-events:none;white-space:nowrap;max-width:calc(100% - 160px);overflow:hidden;text-overflow:ellipsis}
.minimap{position:absolute;left:12px;bottom:16px;z-index:20;background:rgba(255,250,240,.94);border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:3px 4px 0 rgba(0,0,0,.25);touch-action:none}
.minimap canvas{display:block}
.minimap .cap{position:absolute;left:6px;top:4px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#333;pointer-events:none}

/* list */
#listview{display:none;flex:1;overflow:auto;background:var(--sand);color:var(--ink);padding:12px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#app.list #stage{display:none}
#app.list #listview{display:block}
.l-div{background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.l-div summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;color:#fff;display:flex;justify-content:space-between;align-items:center}
.l-div summary::-webkit-details-marker{display:none}
.l-div .l-body{padding:8px}
.l-dept{margin:8px 0;border:1px solid var(--line);border-radius:12px;padding:8px}
.l-dept h3{margin:0 0 8px;font-size:.9rem}
.l-bot{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:#fff;border-radius:10px;padding:8px;cursor:pointer;font:inherit;border:1px solid transparent}
.l-bot:hover{background:#fff6d8;border-color:#e0a100}
.l-bot .ico{width:36px;height:36px;flex:none}
.l-bot b{display:block;font-size:.95rem}
.l-bot span{display:block;font-size:.8rem;color:var(--muted)}
.l-empty{padding:30px;text-align:center;font-weight:700}

/* modal */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:60;background:rgba(15,16,18,.62);display:grid;place-items:center;padding:20px}
#modal .sheet{background:#fff;color:var(--ink);width:min(560px,100%);border-radius:20px;border:3px solid var(--ink);padding:22px;max-height:min(86dvh,720px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#modal .tag{display:inline-block;background:#ffbf3c;color:#2a1d00;font-weight:800;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
#modal h3{margin:10px 0 4px;font-size:1.45rem}
#modal .meta{font-weight:700;color:var(--muted);font-size:.9rem;margin-bottom:10px}
#modal .duty{margin:0 0 14px}
#modal .bubble{background:#e8f6e8;border-radius:16px;padding:14px 16px;white-space:pre-wrap;line-height:1.45}
#modal .close{margin-top:14px;font:inherit;font-weight:800;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;min-height:44px}

/* intro anim */
.anim .pop{opacity:0;transform:scale(.84) translateY(16px)}
.play .pop{animation:popin .55s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes popin{to{opacity:1;transform:none}}
.play .connectors path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .anim .pop,.play .pop{opacity:1;transform:none;animation:none}
  .play .connectors path.draw{stroke-dashoffset:0;animation:none}
}

/* export / poster */
html.export,html.export body{height:auto;overflow:visible;background:var(--sand)}
html.export #app{height:auto;display:block}
html.export .chrome,html.export .zoombar,html.export .hint,html.export .minimap,html.export #listview,html.export #modal{display:none!important}
html.export #stage{position:static;overflow:visible;height:auto;background:transparent;cursor:default}
html.export #world{position:relative;transform:none!important;will-change:auto}

@media (max-width:700px){
  .brand .n small{display:none}
  .ticker{font-size:.72rem;gap:8px}
  .search button{padding:10px 10px}
  .hint{bottom:8px;font-size:11px;max-width:calc(100% - 24px);left:12px;right:12px;transform:none;text-align:center;white-space:normal;display:none}
  .minimap{left:8px;bottom:8px;transform:scale(.86);transform-origin:bottom left}
  .zoombar{right:8px;top:8px;gap:4px}
  .zoombar button,.zoombar .zl{min-width:38px;min-height:36px;border-radius:10px;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
  .zoombar .pm{font-size:18px}
  .zoombar .wide{font-size:10px;padding:0 6px}
}
</style>
</head>

arbustos. También marqué tres fotos de sus trabajos para reemplazar las de muestra, cuando usted las apruebe."}}, {"id": "voice", "glyph": "voice", "t": {"en": "Brand & Voice Guide", "es": "Guía de tono y voz"}, "d": {"en": "A short guide so posts and texts sound like Richi — plain, friendly, and bilingual.", "es": "Una guía breve para que publicaciones y textos suenen a Richi: sencillos, amables y bilingües."}, "s": {"en": "Voice notes: short sentences, no slang that wouldn't fit a family business, always “call or text for an estimate,” and a Spanish version of anything public. I'll follow this unless you change it.", "es": "Notas de tono: frases cortas, sin jerga que no quede en un negocio familiar, siempre “llame o envíe un texto para un estimado,” y una versión en español de todo lo público. Seguiré esto salvo que usted lo cambie."}}, {"id": "menu", "glyph": "list", "t": {"en": "Service Menu Writer", "es": "Menú de servicios"}, "d": {"en": "Plain descriptions of what Trejo offers, with no prices unless Richi provides them.", "es": "Descripciones sencillas de lo que ofrece Trejo, sin precios a menos que Richi los proporcione."}, "s": {"en": "Draft service menu: residential and commercial lawn care and mowing; tree and shrub trimming and removal; weed control; general landscaping. Call or text for an estimate.", "es": "Borrador del menú de servicios: cuidado y corte de césped residencial y comercial; poda y remoción de árboles y arbustos; control de maleza; paisajismo en general. Llame o envíe un texto para un estimado."}}]}]}, {"id": "ops", "color": "#1d5a28", "accent": "#7bc87f", "t": {"en": "Operations & Field Support", "es": "Operaciones y apoyo en campo"}, "blurb": {"en": "Routes, weather moves, job lists, and yard-care timing — prepared for the crew after Richi signs off.", "es": "Rutas, cambios por el clima, listas de trabajo y tiempos de cuidado del jardín, listos para la cuadrilla cuando Richi dé el visto bueno."}, "depts": [{"id": "sched", "t": {"en": "Scheduling & Dispatch", "es": "Programación y despacho"}, "bots": [{"id": "sched", "glyph": "schedule", "t": {"en": "Crew Scheduler", "es": "Programador de cuadrilla"}, "d": {"en": "Weekly West Valley routes, built for Richi to adjust before anyone is sent out.", "es": "Rutas semanales del West Valley, armadas para que Richi las ajuste antes de enviar a nadie."}, "s": {"en": "Draft week: Mon–Tue Buckeye lawns, Wed Litchfield Park trims, Thu–Fri Goodyear. Heat is high Thursday; I clustered those stops closer to the morning. Waiting for your OK.", "es": "Borrador de la semana: lun–mar céspedes en Buckeye, mié podas en Litchfield Park, jue–vie Goodyear. El jueves hará mucho calor; junté esas paradas más temprano. Esperando su visto bueno."}}, {"id": "route", "glyph": "route", "t": {"en": "Route Planner", "es": "Planificador de rutas"}, "d": {"en": "A sensible order of stops for the day, so the crew is not zigzagging the Valley.", "es": "Un orden sensato de paradas para el día, para que la cuadrilla no cruce el valle de un lado a otro."}, "s": {"en": "Tomorrow's draft route: start west in Buckeye, then Litchfield Park, finish in Goodyear. Four stops, with drive notes. You can swap the order before it goes to the crew.", "es": "Borrador de la ruta de mañana: empezar al oeste en Buckeye, luego Litchfield Park y terminar en Goodyear. Cuatro paradas, con notas de manejo. Puede cambiar el orden antes de enviarla a la cuadrilla."}}, {"id": "wx", "glyph": "weather", "t": {"en": "Weather Watcher", "es": "Vigilancia del clima"}, "d": {"en": "Watches heat and rain and drafts a move, instead of leaving the crew in a bad day.", "es": "Vigila el calor y la lluvia y arma un cambio, en vez de dejar a la cuadrilla en un mal día."}, "s": {"en": "Weather note: a late-day storm is in the Friday forecast. Draft plan: move the open yard work to Saturday morning and keep Friday for the covered trim on Indian School. OK?", "es": "Nota del clima: el pronóstico del viernes trae tormenta por la tarde. Plan en borrador: pasar el trabajo en lote abierto al sábado por la mañana y dejar el viernes para la poda bajo cubierta en Indian School. ¿Le parece?"}}, {"id": "joblist", "glyph": "send", "t": {"en": "Job List Messenger", "es": "Lista de trabajo"}, "d": {"en": "A simple daily list for each crew member, sent only after Richi says go.", "es": "Una lista sencilla del día para cada miembro de la cuadrilla, que solo se envía cuando Richi lo autorice."}, "s": {"en": "Draft list for Crew member 3, Thursday: 1) 8:00 a.m. mow in Buckeye, 2) shrub trim next door, 3) load green waste on the way back. Not sent until you OK it.", "es": "Borrador de lista para el miembro de cuadrilla 3, jueves: 1) 8:00 a.m. corte en Buckeye, 2) poda de arbustos en la casa de al lado, 3) cargar los desechos verdes de regreso. No se envía hasta que usted lo apruebe."}}, {"id": "rain", "glyph": "rain", "t": {"en": "Rain-Day Rescheduler", "es": "Reprogramación por lluvia"}, "d": {"en": "Moves jobs and drafts customer texts when rain washes out a day.", "es": "Mueve trabajos y redacta textos a los clientes cuando la lluvia cancela el día."}, "s": {"en": "Rain plan: Thursday's two open-yard mows can shift to Saturday morning. Draft customer text: “We're moving you to Saturday morning because of the rain. Reply if that does not work.” Waiting for your OK.", "es": "Plan por lluvia: los dos cortes en lote abierto del jueves pueden pasar al sábado por la mañana. Borrador de texto: “Por la lluvia lo estamos pasando al sábado por la mañana. Responda si no le funciona.” Esperando su visto bueno."}}, {"id": "recur", "glyph": "repeat", "t": {"en": "Recurring Calendar", "es": "Calendario recurrente"}, "d": {"en": "The weekly and every-other-week lawn route, kept in one place.", "es": "La ruta de césped semanal y quincenal, junta en un solo lugar."}, "s": {"en": "Recurring lawn route, this cycle: 11 weekly stops and 6 every-other-week stops. I flagged one Buckeye address as a skip this week, per your note last Friday.", "es": "Ruta recurrente de césped, en este ciclo: 11 paradas semanales y 6 quincenales. Marqué una dirección en Buckeye para omitirla esta semana, según su nota del viernes pasado."}}]}, {"id": "advise", "t": {"en": "Field Advisors", "es": "Asesores de campo"}, "bots": [{"id": "irrig", "glyph": "water", "t": {"en": "Irrigation Scheduler", "es": "Programa de riego"}, "d": {"en": "Seasonal watering intervals drawn from University of Arizona guidance, for Richi to share.", "es": "Intervalos de riego por temporada, tomados de la guía de la Universidad de Arizona, para que Richi los comparta."}, "s": {"en": "Draft watering note for an established desert-adapted tree in the Phoenix area: winter intervals of 30–60 days, summer 7–21 days, and skip a turn after a half inch of rain. Source: UA Cooperative Extension.", "es": "Nota de riego para un árbol establecido y adaptado al desierto en el área de Phoenix: en invierno, cada 30 a 60 días; en verano, cada 7 a 21 días; y omitir un riego después de media pulgada de lluvia. Fuente: Extensión Cooperativa de la UA."}}, {"id": "h2o", "glyph": "alert", "t": {"en": "Water-Restriction Alerts", "es": "Alertas de restricciones de agua"}, "d": {"en": "Watches public city and water-provider notices and drafts a heads-up.", "es": "Vigila avisos públicos de la ciudad y del proveedor de agua y arma un aviso."}, "s": {"en": "Public notice check: I did not find a new watering restriction for Buckeye this week. I'll keep watching and draft a customer note if a city or provider posts one.", "es": "Revisión de avisos públicos: esta semana no encontré una restricción nueva de riego para Buckeye. Seguiré pendiente y redactaré una nota para los clientes si la ciudad o el proveedor publica alguna."}}, {"id": "weed", "glyph": "weed", "t": {"en": "Pest & Weed Timing", "es": "Tiempos de maleza y plagas"}, "d": {"en": "Pre-emergent and treatment windows from Extension sources, not a product pitch.", "es": "Ventanas de preemergente y de tratamiento, según fuentes de la Extensión, no un anuncio de productos."}, "s": {"en": "Timing note: for non-overseeded bermudagrass, UA Extension suggests a fall pre-emergent in late September or early October, and a spring window when soil at 2 inches is near 50°F (often late February to early March in Phoenix).", "es": "Nota de tiempos: en céspedes de bermuda sin resembrar, la Extensión de la UA sugiere un preemergente de otoño a finales de septiembre o principios de octubre, y una ventana de primavera cuando el suelo a 2 pulgadas esté cerca de 50°F (a menudo de finales de febrero a principios de marzo en Phoenix)."}}, {"id": "tree", "glyph": "tree", "t": {"en": "Tree Care Advisor", "es": "Asesor de árboles"}, "d": {"en": "Pruning timing and care notes for desert trees, as guidance for Richi and the crew.", "es": "Notas de época de poda y cuidado de árboles del desierto, como guía para Richi y la cuadrilla."}, "s": {"en": "Care note: UA guidance is to never remove more than 25–30% of a tree's canopy in a year, and not to top trees. Light cleanup can be done almost year-round in the low desert.", "es": "Nota de cuidado: la guía de la UA es no quitar más del 25–30% de la copa de un árbol en un año, y no descabezar los árboles. En el desierto bajo, la limpieza ligera se puede hacer casi todo el año."}}, {"id": "tips", "glyph": "tips", "t": {"en": "Yard-Tips Advisor", "es": "Consejos para el jardín"}, "d": {"en": "Seasonal Arizona tips Richi can send to customers, with sources cited.", "es": "Consejos de temporada en Arizona que Richi puede enviar a sus clientes, con las fuentes citadas."}, "s": {"en": "Draft customer tip: October is the usual window to overseed bermudagrass with ryegrass in the low desert, when days are about 80–85°F. Source: UA Cooperative Extension, az1683. For your OK.", "es": "Borrador de consejo: octubre suele ser la época para resembrar bermuda con ryegrass en el desierto bajo, cuando de día hay unos 80–85°F. Fuente: Extensión Cooperativa de la UA, az1683. Para su visto bueno."}}, {"id": "plants", "glyph": "plant", "t": {"en": "Plant List Advisor", "es": "Lista de plantas"}, "d": {"en": "Desert-adapted plant ideas for a proposal, not a guarantee of what will grow.", "es": "Ideas de plantas adaptadas al desierto para una propuesta, no una garantía de lo que vaya a crecer."}, "s": {"en": "Starter plant list for a west-facing Buckeye yard: palo verde, texas sage, and a low agave border. This is a conversation starter for you to adjust, not a finished landscape plan.", "es": "Lista inicial para un jardín con frente al oeste en Buckeye: palo verde, salvia de Texas y un borde bajo de agave. Es un punto de partida para que usted lo ajuste, no un plan de paisajismo terminado."}}, {"id": "lawncal", "glyph": "lawn", "t": {"en": "Lawn Care Calendar", "es": "Calendario del césped"}, "d": {"en": "A seasonal mowing and overseed calendar from Extension guidance, tailored to the West Valley.", "es": "Un calendario de corte y resiembra por temporada, según la Extensión, para el West Valley."}, "s": {"en": "Lawn calendar draft: summer bermudagrass care through early fall; overseed window in October for Phoenix-area lawns that want winter green; hold off on heavy bermuda feeding as nights cool. Sources cited.", "es": "Borrador del calendario del césped: cuidado de bermuda en verano hasta principios de otoño; ventana de resiembra en octubre para céspedes del área de Phoenix que quieran verde en invierno; reducir la fertilización fuerte de bermuda cuando refresquen las noches. Fuentes citadas."}}]}, {"id": "job", "t": {"en": "Job Support", "es": "Apoyo a los trabajos"}, "bots": [{"id": "wo", "glyph": "clipboard", "t": {"en": "Work Order Organizer", "es": "Órdenes de trabajo"}, "d": {"en": "Each job's details — address, scope, notes — in one sheet the crew can use.", "es": "Los detalles de cada trabajo — dirección, alcance, notas — en una hoja que pueda usar la cuadrilla."}, "s": {"en": "Work order draft, job 47: address in Goodyear, shrub trim and weed pull, gate code on file, dog in the backyard after 3 p.m. Ready for you to OK and pass to the crew.", "es": "Borrador de orden, trabajo 47: dirección en Goodyear, poda de arbustos y deshierbe, código del portón en el archivo, perro en el patio trasero después de las 3 p.m. Lista para que usted la apruebe y se la pase a la cuadrilla."}}, {"id": "status", "glyph": "status", "t": {"en": "Job Status Tracker", "es": "Estado de los trabajos"}, "d": {"en": "What's scheduled, in progress, done, or waiting, in a simple board.", "es": "Lo que está programado, en curso, terminado o en espera, en un tablero sencillo."}, "s": {"en": "Status board: 5 jobs scheduled this week, 2 in progress today, 3 done and waiting on an invoice draft, 1 quote still open.", "es": "Tablero de estado: 5 trabajos programados esta semana, 2 en curso hoy, 3 terminados y en espera de un borrador de factura, 1 cotización todavía abierta."}}, {"id": "qc", "glyph": "check", "t": {"en": "Quality Checklist", "es": "Lista de control de calidad"}, "d": {"en": "A post-job walkthrough list so the crew can catch misses before they leave.", "es": "Una lista de recorrido al terminar, para que la cuadrilla detecte fallas antes de irse."}, "s": {"en": "Draft checklist: walk the curb line, blow off hardscape, confirm gates are closed, take one after photo of the front, and text Richi if anything looks off.", "es": "Borrador de lista: recorrer la línea de la banqueta, soplar el concreto, confirmar que los portones queden cerrados, tomar una foto final del frente y enviarle un texto a Richi si algo no se ve bien."}}, {"id": "jphoto", "glyph": "album", "t": {"en": "Job Photo Organizer", "es": "Organizador de fotos del trabajo"}, "d": {"en": "Names and sorts job-site photos so before-and-after sets are easy to find.", "es": "Nombra y ordena las fotos del sitio para que los juegos de antes y después se encuentren fácil."}, "s": {"en": "Renamed and sorted 12 photos from Thursday's Litchfield Park trim into before/after folders. Two slightly blurry shots are in a “maybe” folder for you to drop.", "es": "Renombré y ordené 12 fotos de la poda del jueves en Litchfield Park en carpetas de antes y después. Dos tomas un poco borrosas quedaron en una carpeta de “tal vez” para que usted las descarte."}}, {"id": "truck", "glyph": "truck", "t": {"en": "Truck & Equipment List", "es": "Lista del camión y equipo"}, "d": {"en": "A daily load-out list so the truck leaves with what the day needs.", "es": "Una lista de carga diaria para que el camión salga con lo que el día necesita."}, "s": {"en": "Thursday load-out draft: mowers, string trimmers, blower, pole saw, fuel, water jugs, and safety cones. Plus the job lists and a printed route.", "es": "Borrador de carga del jueves: podadoras, desbrozadoras, sopladora, sierra de pértiga, combustible, garrafones de agua y conos de seguridad. Más las listas de trabajo y una ruta impresa."}}, {"id": "supply", "glyph": "box", "t": {"en": "Supply List Builder", "es": "Lista de materiales"}, "d": {"en": "A materials list for tomorrow's jobs, from the work orders Richi already has.", "es": "Una lista de materiales para los trabajos de mañana, a partir de las órdenes que Richi ya tiene."}, "s": {"en": "Supply draft for Friday: 4 bags of decorative rock (type as specified on job 51), string-trimmer line, and contractor bags. I did not place an order.", "es": "Borrador de materiales para el viernes: 4 bolsas de roca decorativa (del tipo indicado en el trabajo 51), hilo para desbrozadora y bolsas para escombros. No hice ningún pedido."}}, {"id": "vendor", "glyph": "vendor", "t": {"en": "Vendor & Sub Coordinator", "es": "Coordinación de proveedores y subcontratos"}, "d": {"en": "Drafts and a shared schedule for vendors or subcontractors Richi already uses.", "es": "Borradores y un calendario compartido para proveedores o subcontratistas que Richi ya use."}, "s": {"en": "Draft text to your rock supplier: “Please confirm Friday morning pickup for the Goodyear job. I'll send the address when you confirm.” Not sent until you OK it.", "es": "Borrador de texto a su proveedor de roca: “Por favor confirme la recolección del viernes por la mañana para el trabajo en Goodyear. Le mando la dirección cuando confirme.” No se envía hasta que usted lo apruebe."}}, {"id": "permits", "glyph": "permit", "t": {"en": "Permits & HOA Lookup", "es": "Permisos y reglas de HOA"}, "d": {"en": "Looks up public permit and HOA rules and turns them into a checklist.", "es": "Consulta reglas públicas de permisos y de HOA y las convierte en una lista de verificación."}, "s": {"en": "Public lookup: the city of Buckeye's site lists when a permit may be needed for certain walls and larger structural work. I made a checklist; I cannot file a permit or speak for an HOA.", "es": "Consulta pública: el sitio de la ciudad de Buckeye indica cuándo puede hacer falta un permiso para ciertos muros y obras estructurales más grandes. Armé una lista; no puedo tramitar un permiso ni hablar en nombre de una HOA."}}, {"id": "prop", "glyph": "house", "t": {"en": "Property Notes", "es": "Notas de la propiedad"}, "d": {"en": "Gate codes, dogs, parking, and HOA notes for each customer, in one card.", "es": "Códigos de portón, perros, estacionamiento y notas de HOA de cada cliente, en una ficha."}, "s": {"en": "Property card, customer in Goodyear: side gate code on file, dog is indoors until noon, park on the street not the driveway, HOA asks crews to start after 7:00 a.m.", "es": "Ficha de la propiedad, cliente en Goodyear: código del portón lateral en el archivo, el perro está adentro hasta el mediodía, estacionarse en la calle y no en la entrada, la HOA pide que las cuadrillas empiecen después de las 7:00 a.m."}}, {"id": "maint", "glyph": "wrench", "t": {"en": "Equipment Maintenance Log", "es": "Bitácora de mantenimiento"}, "d": {"en": "A log of service dates for mowers, trucks, and tools, with upcoming reminders.", "es": "Un registro de fechas de servicio de podadoras, camiones y herramientas, con recordatorios próximos."}, "s": {"en": "Log update: mower #2 last blade sharpening is on the card you gave me. I set a reminder to ask you about the next one in 30 days. No shop appointment was booked.", "es": "Actualización de bitácora: el último afilado de cuchillas de la podadora 2 está en la ficha que usted me dio. Puse un recordatorio para preguntarle por el siguiente en 30 días. No cité ninguna cita en el taller."}}, {"id": "incident", "glyph": "incident", "t": {"en": "Incident Notes", "es": "Notas de incidentes"}, "d": {"en": "A calm write-up of something that happened on a job, for Richi's file.", "es": "Una nota serena de algo que pasó en un trabajo, para el archivo de Richi."}, "s": {"en": "Incident note draft: at the Buckeye stop, a sprinkler head was already broken when the crew arrived. Photos are attached. No message has been sent to the customer.", "es": "Borrador de nota: en la parada de Buckeye, un aspersor ya estaba roto cuando llegó la cuadrilla. Van fotos adjuntas. No se le ha enviado ningún mensaje al cliente."}}, {"id": "waste", "glyph": "dump", "t": {"en": "Green Waste & Disposal", "es": "Desechos verdes y disposición"}, "d": {"en": "Notes on green-waste drop-off and what the crew should haul versus leave.", "es": "Notas sobre dónde dejar los desechos verdes y qué debe llevarse la cuadrilla o dejar."}, "s": {"en": "Disposal note: Thursday's trimmings can go to the usual green-waste site; keep the rock and soil separate. I'll add the site hours you use to the Friday job list once you confirm.", "es": "Nota de disposición: las podas del jueves pueden ir al sitio de desechos verdes de siempre; separe la roca y la tierra. Agregaré el horario del sitio que usted usa a la lista del viernes cuando lo confirme."}}]}]}, {"id": "money", "color": "#7a5a12", "accent": "#ffd27a", "t": {"en": "Money", "es": "Dinero"}, "blurb": {"en": "Invoices, reminders, and organized books — drafts and records, not spending, until Richi says so.", "es": "Facturas, recordatorios y cuentas en orden: borradores y registros, sin gastar, hasta que Richi lo diga."}, "depts": [{"id": "billing", "t": {"en": "Billing & Collections", "es": "Facturación y cobros"}, "bots": [{"id": "invoice", "glyph": "invoice", "t": {"en": "Invoice Drafter", "es": "Redactor de facturas"}, "d": {"en": "Builds the invoice from Richi's prices and the completed job, and waits for an OK.", "es": "Arma la factura con los precios de Richi y el trabajo terminado, y espera el visto bueno."}, "s": {"en": "Draft invoice for last Thursday's lawn route in Buckeye, using your price list. Totals are blank until you fill them. Nothing has been sent to the customer.", "es": "Borrador de factura de la ruta de césped del jueves en Buckeye, usando su lista de precios. Los totales quedan en blanco hasta que usted los llene. No se le ha enviado nada al cliente."}}, {"id": "payfu", "glyph": "dollar", "t": {"en": "Payment Follow-up", "es": "Seguimiento de pagos"}, "d": {"en": "A polite payment reminder, sent only after Richi OKs it.", "es": "Un recordatorio cortés de pago, que solo se envía cuando Richi lo aprueba."}, "s": {"en": "Draft: “Hi, just a friendly reminder that invoice #142 is still open. You can reply here if you have a question. Thank you. — Richi, Trejo Landscaping.”", "es": "Borrador: “Hola, le escribo solo para recordarle que la factura n.° 142 sigue abierta. Puede responder a este mensaje si tiene alguna duda. Gracias. — Richi, Trejo Landscaping.”"}}, {"id": "deposit", "glyph": "deposit", "t": {"en": "Deposit Request", "es": "Solicitud de anticipo"}, "d": {"en": "A deposit request for a larger job, only if Richi wants one, with his figures.", "es": "Una solicitud de anticipo para un trabajo más grande, solo si Richi la quiere, con sus cifras."}, "s": {"en": "Draft deposit note: “To hold the start date we talked about, a deposit can be arranged. I’ll confirm the amount with you from my price list.” Amount left blank for you.", "es": "Borrador de nota de anticipo: “Para reservar la fecha de inicio que platicamos, se puede acordar un anticipo. Yo le confirmo el monto con mi lista de precios.” El monto queda en blanco para usted."}}, {"id": "pipe", "glyph": "pipeline", "t": {"en": "Quote-to-Job Pipeline", "es": "Embudo de cotizaciones a trabajos"}, "d": {"en": "A board of open quotes, booked jobs, and finished work waiting to bill.", "es": "Un tablero de cotizaciones abiertas, trabajos agendados y trabajos terminados por facturar."}, "s": {"en": "Pipeline: 4 open quotes, 2 booked and not yet started, 3 finished and waiting on an invoice draft. No dates or totals were changed.", "es": "Embudo: 4 cotizaciones abiertas, 2 agendados y aún no empezados, 3 terminados y en espera de un borrador de factura. No se cambió ninguna fecha ni total."}}]}, {"id": "books", "t": {"en": "Books & Planning", "es": "Cuentas y planeación"}, "bots": [{"id": "expense", "glyph": "receipt", "t": {"en": "Expense & Receipt Organizer", "es": "Organizador de gastos y recibos"}, "d": {"en": "Turns receipt photos into a simple list for Richi's accountant, not a filed return.", "es": "Convierte fotos de recibos en una lista sencilla para el contador de Richi, no en una declaración presentada."}, "s": {"en": "I listed 8 receipts you photographed this week: fuel, a hardware run, and a parts shop. The folder is ready to hand to your accountant. I did not file anything.", "es": "Listé 8 recibos que usted fotografió esta semana: combustible, una compra de ferretería y un taller de refacciones. La carpeta está lista para entregársela a su contador. Yo no presenté nada."}}, {"id": "cash", "glyph": "cash", "t": {"en": "Weekly Cash Snapshot", "es": "Resumen semanal de caja"}, "d": {"en": "A simple picture of what came in and what is still outstanding, from Richi's own records.", "es": "Una foto sencilla de lo que entró y de lo que sigue pendiente, a partir de los registros de Richi."}, "s": {"en": "This week's snapshot, from the records you shared: 3 payments noted as received, 2 invoices still open. I did not change any numbers.", "es": "Resumen de esta semana, según los registros que usted compartió: 3 pagos anotados como recibidos, 2 facturas todavía abiertas. No cambié ninguna cifra."}}, {"id": "vbills", "glyph": "bill", "t": {"en": "Vendor Bill Tracker", "es": "Cuentas de proveedores"}, "d": {"en": "What's owed to suppliers, so Richi can decide what to pay and when.", "es": "Lo que se debe a proveedores, para que Richi decida qué pagar y cuándo."}, "s": {"en": "Vendor board: one open bill from the rock supplier, due date as printed on the invoice you gave me. I did not schedule a payment.", "es": "Tablero de proveedores: una cuenta abierta del proveedor de roca, con la fecha de vencimiento impresa en la factura que usted me dio. No programé ningún pago."}}, {"id": "budget", "glyph": "budget", "t": {"en": "Seasonal Budget Notes", "es": "Notas de presupuesto por temporada"}, "d": {"en": "Planning notes for a slower or busier season, not a formal budget or forecast.", "es": "Notas de planeación para una temporada más lenta o más movida, no un presupuesto ni un pronóstico formal."}, "s": {"en": "Planning notes: fall often brings pre-emergent and tree work; mid-summer can be slower mid-day because of heat. These are notes for you, not a forecast of income.", "es": "Notas de planeación: en otoño suele haber trabajo de preemergente y de árboles; a mediados del verano el mediodía puede ser más lento por el calor. Son notas para usted, no un pronóstico de ingresos."}}, {"id": "grants", "glyph": "grant", "t": {"en": "Grants & Loans Research", "es": "Investigación de apoyos y créditos"}, "d": {"en": "Public programs and small-business resources, for Richi to review — no applications filed.", "es": "Programas públicos y recursos para pequeños negocios, para que Richi los revise; no se presenta ninguna solicitud."}, "s": {"en": "Research brief: I listed publicly posted small-business counseling and loan-information pages for Arizona. I did not apply for anything or share your information.", "es": "Resumen de investigación: listé páginas públicas de asesoría y de información de créditos para pequeños negocios en Arizona. No solicité nada ni compartí su información."}}, {"id": "tax", "glyph": "tax", "t": {"en": "Tax-Season Packet", "es": "Paquete de temporada de impuestos"}, "d": {"en": "Organizes documents for a real tax professional; does not prepare or file a return.", "es": "Organiza documentos para un profesional de impuestos de verdad; no prepara ni presenta una declaración."}, "s": {"en": "Your tax-season folder now has the receipt list, the invoice log you exported, and a checklist of questions for your tax pro. I cannot prepare or file a return.", "es": "Su carpeta de temporada de impuestos ya tiene la lista de recibos, el registro de facturas que usted exportó y una lista de preguntas para su profesional de impuestos. Yo no puedo preparar ni presentar una declaración."}}, {"id": "prices", "glyph": "prices", "t": {"en": "Price List Librarian", "es": "Biblioteca de lista de precios"}, "d": {"en": "Keeps Richi's price list handy for estimates, and never invents a rate.", "es": "Tiene a la mano la lista de precios de Richi para los estimados, y nunca inventa una tarifa."}, "s": {"en": "Your price list is on file the way you last updated it. The estimate I'm drafting will leave any missing item blank for you, rather than guess.", "es": "Su lista de precios está archivada como la actualizó la última vez. En el estimado que estoy redactando, cualquier partida que falte quedará en blanco para usted, en vez de adivinarla."}}]}]}, {"id": "people", "color": "#234a7a", "accent": "#8cb4e8", "t": {"en": "People", "es": "Personas"}, "blurb": {"en": "Hiring help, training, and crew care — drafts and checklists, never a hire or a firing on their own.", "es": "Ayuda para contratar, capacitación y cuidado de la cuadrilla: borradores y listas, nunca una contratación ni un despido por su cuenta."}, "depts": [{"id": "recruit", "t": {"en": "Recruiting", "es": "Reclutamiento"}, "bots": [{"id": "jobpost", "glyph": "jobpost", "t": {"en": "Job Post Writer", "es": "Redactor de anuncios de trabajo"}, "d": {"en": "Crew job ads in English and Spanish, posted only after Richi's OK.", "es": "Anuncios para la cuadrilla en inglés y en español, que solo se publican con el visto bueno de Richi."}, "s": {"en": "Draft job post (EN/ES): “Trejo Landscaping in Buckeye is looking for crew members. Lawn care and landscaping experience is a plus. Call or text (623) 910-5790.” Not posted yet.", "es": "Borrador de anuncio (EN/ES): “Trejo Landscaping en Buckeye busca miembros de cuadrilla. Se agradece experiencia en césped y paisajismo. Llame o envíe un texto al (623) 910-5790.” Todavía no se publica."}}, {"id": "screen", "glyph": "resume", "t": {"en": "Applicant Summaries", "es": "Resúmenes de candidatos"}, "d": {"en": "A short recap of each application or text, so Richi can decide who to call.", "es": "Un recuento corto de cada solicitud o texto, para que Richi decida a quién llamar."}, "s": {"en": "Applicant summary: a text from a Goodyear resident with two years of mowing experience, available mornings. I did not reply. Want a callback draft?", "es": "Resumen de candidato: un texto de un residente de Goodyear con dos años de experiencia en corte de césped, disponible por las mañanas. No respondí. ¿Quiere un borrador de llamada o de texto?"}}, {"id": "interview", "glyph": "interview", "t": {"en": "Interview Prep", "es": "Preparación de entrevistas"}, "d": {"en": "A short list of questions and a scorecard for a crew interview.", "es": "Una lista corta de preguntas y una hoja de evaluación para una entrevista de cuadrilla."}, "s": {"en": "Draft questions: experience with mowers and trimmers, comfort in summer heat, reliable transportation, and a simple Spanish/English check if you want it. Scorecard attached.", "es": "Borrador de preguntas: experiencia con podadoras y desbrozadoras, desenvoltura con el calor del verano, transporte propio, y una revisión sencilla de español/inglés si usted quiere. Va la hoja de evaluación."}}, {"id": "offer", "glyph": "offer", "t": {"en": "Offer Letter Drafter", "es": "Borrador de carta de oferta"}, "d": {"en": "A simple offer letter for Richi's review, using only the terms he provides.", "es": "Una carta de oferta sencilla para que Richi la revise, solo con los términos que él indique."}, "s": {"en": "Draft offer letter with the pay, start date, and hours you wrote down. Please review before anyone sees it. I will not send it.", "es": "Borrador de carta de oferta con el sueldo, la fecha de inicio y el horario que usted anotó. Por favor revísela antes de que alguien la vea. Yo no la enviaré."}}, {"id": "reccal", "glyph": "calendar", "t": {"en": "Recruitment Calendar", "es": "Calendario de reclutamiento"}, "d": {"en": "Open roles and interview times, in one place.", "es": "Vacantes y horarios de entrevistas, en un solo lugar."}, "s": {"en": "Recruiting calendar: one crew opening is listed, with two interview slots you set for Thursday afternoon. Reminders will wait for your OK before they go to the applicants.", "es": "Calendario de reclutamiento: hay una vacante de cuadrilla, con dos horarios de entrevista que usted fijó para el jueves por la tarde. Los recordatorios esperarán su visto bueno antes de ir a los candidatos."}}]}, {"id": "train", "t": {"en": "Training & Crew Care", "es": "Capacitación y cuidado de la cuadrilla"}, "bots": [{"id": "howto", "glyph": "guide", "t": {"en": "How-To Guides", "es": "Guías prácticas"}, "d": {"en": "Step-by-step crew guides in English and Spanish, for the way Richi wants the work done.", "es": "Guías paso a paso para la cuadrilla, en inglés y en español, del modo en que Richi quiere que se haga el trabajo."}, "s": {"en": "Draft bilingual how-to: “How we edge a front lawn.” Photos can be added from a job you choose. This stays an internal guide until you say otherwise.", "es": "Borrador de guía bilingüe: “Así delineamos un césped del frente.” Se pueden agregar fotos de un trabajo que usted elija. Se queda como guía interna hasta que usted diga lo contrario."}}, {"id": "safety", "glyph": "hardhat", "t": {"en": "Safety Training", "es": "Capacitación de seguridad"}, "d": {"en": "Toolbox talks and heat-safety notes the crew can hear or read before a shift.", "es": "Charlas breves y notas de seguridad ante el calor, para que la cuadrilla las oiga o las lea antes del turno."}, "s": {"en": "Draft toolbox talk: summer heat, water breaks, and a reminder to use eye and ear protection with the blower and the string trimmer. English and Spanish versions included.", "es": "Borrador de charla: calor del verano, pausas para agua, y un recordatorio de usar protección para ojos y oídos con la sopladora y la desbrozadora. Incluye versiones en inglés y en español."}}, {"id": "onboard", "glyph": "onboard", "t": {"en": "Onboarding Checklist", "es": "Lista de integración"}, "d": {"en": "A first-week list for a new hire, so nothing important is skipped.", "es": "Una lista de la primera semana para alguien de nuevo ingreso, para no saltarse nada importante."}, "s": {"en": "Draft first-week list: paperwork Richi provides, a safety talk, a shadow day with a crew member, and a short how-to on the daily job list.", "es": "Borrador de lista de la primera semana: los papeles que entregue Richi, una charla de seguridad, un día de acompañamiento con un miembro de la cuadrilla y una guía breve de la lista diaria de trabajo."}}, {"id": "pto", "glyph": "pto", "t": {"en": "Time-Off Calendar", "es": "Calendario de ausencias"}, "d": {"en": "Who is off and how the route is covered, based on what Richi enters.", "es": "Quién falta y cómo se cubre la ruta, según lo que Richi anote."}, "s": {"en": "Time-off board: Crew member 2 is off Friday, per your note. I drafted a coverage shuffle that keeps the Buckeye morning stops intact. For your OK.", "es": "Tablero de ausencias: el miembro de cuadrilla 2 falta el viernes, según su nota. Armé un cambio de cobertura que deja intactas las paradas de la mañana en Buckeye. Para su visto bueno."}}, {"id": "contacts", "glyph": "contacts", "t": {"en": "Crew Contacts", "es": "Contactos de la cuadrilla"}, "d": {"en": "Phones and emergency contacts for the crew, kept private and organized.", "es": "Teléfonos y contactos de emergencia de la cuadrilla, organizados y en privado."}, "s": {"en": "Crew contact card is updated with the numbers you provided. This stays internal. I will not share a number with a customer unless you say to.", "es": "La ficha de contactos de la cuadrilla está actualizada con los números que usted dio. Se queda de uso interno. No compartiré un número con un cliente a menos que usted lo indique."}}, {"id": "crewtr", "glyph": "translate", "t": {"en": "Crew Translator", "es": "Traductor para la cuadrilla"}, "d": {"en": "Turns job lists and short guides into clear English and Spanish for the crew.", "es": "Pasa listas de trabajo y guías cortas a un inglés y un español claros para la cuadrilla."}, "s": {"en": "Bilingual job list for Friday is ready: the same four stops, in English and in Spanish, with the gate-code note in both. Not sent until you OK it.", "es": "Ya está lista la lista bilingüe del viernes: las mismas cuatro paradas, en inglés y en español, con la nota del código del portón en ambos. No se envía hasta que usted la apruebe."}}]}]}, {"id": "cust", "color": "#0e5c5c", "accent": "#7ed0c9", "t": {"en": "Customer", "es": "Clientes"}, "blurb": {"en": "Reminders, inbox help, reviews, and check-ins — every message waits for Richi's OK.", "es": "Recordatorios, ayuda con la bandeja, reseñas y mensajes de seguimiento: cada mensaje espera el visto bueno de Richi."}, "depts": [{"id": "comms", "t": {"en": "Communications", "es": "Comunicación"}, "bots": [{"id": "remind", "glyph": "reminder", "t": {"en": "Appointment Reminder", "es": "Recordatorio de cita"}, "d": {"en": "A friendly reminder before a visit, in the customer's language.", "es": "Un recordatorio amable antes de una visita, en el idioma del cliente."}, "s": {"en": "Hi Carlos, this is Richi at Trejo Landscaping. We're scheduled to be at your place tomorrow morning. Reply if you need to move it. Thank you.", "es": "Hola Carlos, soy Richi de Trejo Landscaping. Mañana por la mañana estamos agendados en su casa. Responda si necesita cambiarlo. Gracias."}}, {"id": "afterhours", "glyph": "phone", "t": {"en": "Phone & After-Hours", "es": "Teléfono y fuera de horario"}, "d": {"en": "Summarizes calls and voicemails, and drafts a missed-call text-back.", "es": "Resume llamadas y buzones de voz, y redacta un texto de devolución si se perdió la llamada."}, "s": {"en": "Voicemail summary: a Goodyear number called at 6:14 p.m. asking for a shrub-trim estimate this week. Draft text-back: “Sorry I missed you — this is Richi. I can come take a look. What days work?”", "es": "Resumen del buzón: un número de Goodyear llamó a las 6:14 p.m. para pedir un estimado de poda de arbustos esta semana. Borrador de texto: “Perdón que no pude contestar — soy Richi. Puedo pasar a ver el jardín. ¿Qué días le quedan bien?”"}}, {"id": "inbox", "glyph": "inbox", "t": {"en": "Email & Inbox Manager", "es": "Correo y bandeja de entrada"}, "d": {"en": "Triage for email and message inboxes, with draft replies in a waiting-for-OK pile.", "es": "Clasifica el correo y los mensajes, con borradores de respuesta en una pila de visto bueno."}, "s": {"en": "Inbox triage: 1 new estimate request, 1 invoice question, and 2 newsletters you can ignore. Draft replies for the first two are in your OK pile.", "es": "Clasificación de la bandeja: 1 solicitud nueva de estimado, 1 pregunta sobre una factura y 2 boletines que puede ignorar. Los borradores de las dos primeras están en su pila de visto bueno."}}, {"id": "welcome", "glyph": "welcome", "t": {"en": "New-Customer Welcome", "es": "Bienvenida a clientes nuevos"}, "d": {"en": "A short welcome after the first job is booked or finished.", "es": "Una bienvenida breve cuando se agenda o se termina el primer trabajo."}, "s": {"en": "Hi Sofia, welcome to Trejo Landscaping. We’re glad to take care of your yard. If you ever need to change a day, just text this number. — Richi", "es": "Hola Sofía, bienvenida a Trejo Landscaping. Nos da gusto cuidar su jardín. Si alguna vez necesita cambiar el día, solo envíe un texto a este número. — Richi"}}, {"id": "faq", "glyph": "faq", "t": {"en": "FAQ Writer", "es": "Preguntas frecuentes"}, "d": {"en": "Clear answers to common questions, in English and Spanish, for the site or for texts.", "es": "Respuestas claras a preguntas comunes, en inglés y en español, para el sitio o para textos."}, "s": {"en": "Draft FAQ: “Do you come to Goodyear and Litchfield Park?” Yes — Buckeye, Goodyear, Litchfield Park, and the West Valley. “Are estimates free?” We say: call or text for an estimate.", "es": "Borrador de preguntas frecuentes: “¿Van a Goodyear y Litchfield Park?” Sí: Buckeye, Goodyear, Litchfield Park y el West Valley. “¿Los estimados son gratis?” Nosotros decimos: llame o envíe un texto para un estimado."}}]}, {"id": "relate", "t": {"en": "Relationships", "es": "Relación con el cliente"}, "bots": [{"id": "satisfy", "glyph": "smile", "t": {"en": "Satisfaction Check-in", "es": "Consulta de satisfacción"}, "d": {"en": "A short ‘how did we do?’ text after a job, waiting for Richi's OK.", "es": "Un texto corto de “¿cómo le quedó?” después de un trabajo, a la espera del visto bueno de Richi."}, "s": {"en": "Hi, this is Richi at Trejo Landscaping. Just checking that yesterday's trim looks the way you wanted. Reply anytime if you want something adjusted.", "es": "Hola, soy Richi de Trejo Landscaping. Solo quería saber si la poda de ayer le quedó como quería. Responda cuando guste si quiere que ajustemos algo."}}, {"id": "reviews", "glyph": "star", "t": {"en": "Reviews Manager", "es": "Gestor de reseñas"}, "
